<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IronCBC</title>
<meta name="description" content="Estimate the probability of iron deficiency (ferritin ≤30 ng/mL) from a complete blood count.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#16202c; --muted:#5b6776; --line:#dde2e8;
  --accent:#b4232f; --accent-ink:#ffffff; --accent-soft:#fbe9ea;
  --ok:#1d7a46; --ok-soft:#e5f4ec; --warn:#a15c00; --warn-soft:#fdf1df; --info:#1f5fa8; --info-soft:#e7f0fb;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141a; --card:#171e26; --ink:#e6ebf1; --muted:#9aa6b4; --line:#2a3440;
    --accent:#e0525c; --accent-ink:#ffffff; --accent-soft:#3a1d21;
    --ok:#4cc386; --ok-soft:#16301f; --warn:#f0a948; --warn-soft:#33260f; --info:#6aa8ef; --info-soft:#152638;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141a; --card:#171e26; --ink:#e6ebf1; --muted:#9aa6b4; --line:#2a3440;
  --accent:#e0525c; --accent-ink:#ffffff; --accent-soft:#3a1d21;
  --ok:#4cc386; --ok-soft:#16301f; --warn:#f0a948; --warn-soft:#33260f; --info:#6aa8ef; --info-soft:#152638;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.6}
header{background:var(--card);border-bottom:1px solid var(--line)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-weight:700}
.brand h1{font-size:19px;margin:0;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.ctrl{display:flex;gap:8px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--muted)}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.primary:hover{filter:brightness(1.05);border-color:var(--accent)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
nav.tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 14px;color:var(--muted);white-space:nowrap;font-weight:500}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
main{padding:20px 0 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{font-size:16.5px;margin:0 0 10px}
.card h3{font-size:15px;margin:14px 0 8px}
.intro{border-inline-start:4px solid var(--accent)}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
label.f span.u{color:var(--muted);font-size:12px}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
input:focus,select:focus{outline:2px solid var(--info);outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.two{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.result{border-radius:12px;padding:16px;margin-bottom:12px}
.result.pos{background:var(--accent-soft)}
.result.neg{background:var(--ok-soft)}
.result.none{background:var(--bg);border:1px dashed var(--line)}
.big{font-size:34px;font-weight:700;line-height:1.1}
.bar{height:12px;background:var(--line);border-radius:6px;position:relative;margin:12px 0 4px;overflow:hidden}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--accent);border-radius:6px}
.bar b{position:absolute;inset-block:-3px;width:2px;background:var(--ink)}
.note{border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
.note.warn{background:var(--warn-soft);color:var(--ink);border-inline-start:3px solid var(--warn)}
.note.info{background:var(--info-soft);border-inline-start:3px solid var(--info)}
.note.err{background:var(--accent-soft);border-inline-start:3px solid var(--accent)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12.5px}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums;direction:ltr}
.tbl{overflow-x:auto;max-height:520px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600}
.pill.r{background:var(--accent-soft);color:var(--accent)}
.pill.g{background:var(--ok-soft);color:var(--ok)}
.pill.n{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.kpi strong{display:block;font-size:22px}
.hidden{display:none}
.inst{display:flex;align-items:center;gap:14px;padding:14px 0 10px;border-bottom:1px solid var(--line)}
.inst img{height:72px;width:auto;background:#fff;border-radius:10px;padding:4px}
.inst .l1{font-weight:700;font-size:17px}
.inst .l2,.inst .l3{font-size:13.5px;color:var(--muted)}
.proj{font-size:13px;background:var(--info-soft);border-inline-start:3px solid var(--info);border-radius:8px;padding:8px 12px;margin:10px 0 0}
@media (max-width:560px){.inst img{height:56px}.inst .l1{font-size:15px}}
footer{color:var(--muted);font-size:12.5px;padding:18px 0 30px;border-top:1px solid var(--line)}
.ltr{direction:ltr;unicode-bidi:isolate}
a{color:var(--info)}
input[type=range]{padding:0;accent-color:var(--accent)}
</style>
</head>

/* ---------------- model ---------------- */
function predictRaw(x){ // x: array in FEATS order
 let s=0;
 for(const tr of MODEL.trees){
  let n=0;
  while(tr.l[n]!==-1){ n = (Math.fround(x[tr.f[n]]) <= tr.t[n]) ? tr.l[n] : tr.r[n]; }
  s+=tr.p[n];
 }
 return s/MODEL.trees.length;
}
const clip = p => Math.min(Math.max(p,1e-4),1-1e-4);
const logit = p => Math.log(clip(p)/(1-clip(p)));
const expit = z => 1/(1+Math.exp(-z));
function getCal(name){
 if(name==='raw') return MODEL.calibrations.nhanes_uncalibrated;
 if(name==='mimic') return MODEL.calibrations.mimic_hospital;
 if(name==='user'){ const c=userCal(); if(c) return c; }
 return MODEL.calibrations.najaf_outpatient_lab;
}

function score(row,calName){
 const x = FEATS.map(f=> f==='female' ? (row.sex==='F'?1:0) : +row[f]);
 const p0 = predictRaw(x);
 const c = getCal(calName);
 const p = expit(c.intercept + c.slope*logit(p0));
 const thr = c.threshold;
 return {p0,p,thr,pos:p>=thr};
}
function clinicalRule(r){ const low = (r.sex==='F' || r.age<15) ? r.HGB<12 : r.HGB<13; return low || r.MCV<80; }
function indices(r){
 return [
  ['Mentzer','MCV/RBC',r.MCV/r.RBC,13],
  ['England–Fraser','MCV−RBC−5Hb−3.4',r.MCV-r.RBC-5*r.HGB-3.4,0],
  ['Srivastava','MCH/RBC',r.MCH/r.RBC,3.8],
  ['Shine–Lal','MCV²×MCH/100',r.MCV*r.MCV*r.MCH/100,1530],
  ['Green–King','MCV²×RDW/(100Hb)',r.MCV*r.MCV*r.RDW_CV/(100*r.HGB),65],
  ['RDWI','MCV×RDW/RBC',r.MCV*r.RDW_CV/r.RBC,220],
  ['Sirdah','MCV−RBC−3Hb',r.MCV-r.RBC-3*r.HGB,27],
  ['Ehsani','MCV−10RBC',r.MCV-10*r.RBC,15],
  ['Ricerca','RDW/RBC',r.RDW_CV/r.RBC,4.4],
 ];
}

function readInputs(){
 const r={}; let ok=true, bad=[];
 document.querySelectorAll('#inputs [data-k]').forEach(e=>{
  const k=e.dataset.k;
  if(k==='sex'){ r.sex=e.value; return; }
  if(e.value===''){ ok=false; return; }
  const v=+e.value; r[k]=v; const f=FIELDS.find(z=>z.k===k);
  if(v<f.min||v>f.max) bad.push(f.lab||f.k);
 });

}
function consistency(r){
 const out=[];
 const mcv=r.HCT/r.RBC*10, mch=r.HGB/r.RBC*10, mchc=r.HGB/r.HCT*100;
 if(Math.abs(mcv-r.MCV)>2) out.push(`${t('chkMCV')}: ${fmt(mcv,1)}`);
 if(Math.abs(mch-r.MCH)>1) out.push(`${t('chkMCH')}: ${fmt(mch,1)}`);
 if(Math.abs(mchc-r.MCHC)>1.5) out.push(`${t('chkMCHC')}: ${fmt(mchc,1)}`);
 return out;
}

const ALIASES = {

};
function normKey(h){ return String(h).trim().toLowerCase().replace(/\s*\(.*?\)\s*/g,'').replace(/\s+/g,' '); }
function mapCols(headers){
 const m={};
 for(const [k,al] of Object.entries(ALIASES)){
  const i=headers.findIndex(h=> al.includes(normKey(h)) || al.includes(String(h).trim().toLowerCase()));
  if(i>=0) m[k]=headers[i];
 }
 return m;
}
function parseSex(v){ const s=String(v).trim().toLowerCase(); if(['f','female','1','أنثى','انثى','ا','أ'].includes(s)) return 'F'; if(['m','male','0','ذكر','ذ'].includes(s)) return 'M'; return null; }
function readFile(file){
 return new Promise((res,rej)=>{
  const fr=new FileReader();
  fr.onload=e=>{ try{ const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'}); const ws=wb.Sheets[wb.SheetNames[0]]; res(XLSX.utils.sheet_to_json(ws,{defval:''})); }catch(err){ rej(err); } };
  fr.onerror=rej; fr.readAsArrayBuffer(file);
 });
}
function cleanRows(raw,needFer){
 if(!raw.length) return {rows:[],skipped:0,missing:['all']};
 const m=mapCols(Object.keys(raw[0]));
 const need=['age','sex','WBC','RBC','HGB','HCT','MCV','MCH','MCHC','RDW_CV','PLT'].concat(needFer?['ferritin']:[]);
 const missing=need.filter(k=>!m[k]); if(missing.length) return {rows:[],skipped:0,missing};
 const rows=[]; let skipped=0;
 raw.forEach((o,i)=>{
  const r={_i:i+1,_src:o}; let ok=true;
  for(const k of need){
   if(k==='sex'){ r.sex=parseSex(o[m.sex]); if(!r.sex) ok=false; continue; }
   let v=parseFloat(String(o[m[k]]).replace(',','.')); if(isNaN(v)){ ok=false; continue; }
   if(k==='HGB'&&v>30) v=v/10; if(k==='HCT'&&v<1.5) v=v*100; if(k==='MCHC'&&v>100) v=v/10;
   r[k]=v;
  }
  if(ok){ for(const f of FIELDS){ if(f.sel) continue; if(r[f.k]<f.min||r[f.k]>f.max){ ok=false; break; } } }
  if(ok) rows.push(r); else skipped++;
 });
 return {rows,skipped,missing:[]};
}

/* ---------------- batch ---------------- */
let BATCH=null;
async function runBatch(){
 const f=$('#batchFile').files[0]; if(!f) return; $('#batchMsg').innerHTML=''; $('#batchSum').innerHTML=''; $('#batchTbl').innerHTML='';
 let raw; try{ raw=await readFile(f); }catch(e){ $('#batchMsg').innerHTML=`<div class="note err">${t('readErr')}</div>`; return; }
 const {rows,skipped,missing}=cleanRows(raw,false);
 if(missing.length){ $('#batchMsg').innerHTML=`<div class="note err">${t('colsMissing')}: <span class="ltr">${missing.join(', ')}</span></div>`; return; }
 const cal=$('#calSelect2').value;
 rows.forEach(r=>{ const s=score(r,cal); r.prob=s.p; r.rec=s.pos; r.rule=clinicalRule(r); r.thal=r.MCV<80&&r.MCV/r.RBC<13; });
 BATCH={rows,cal};
 const nPos=rows.filter(r=>r.rec).length, nRule=rows.filter(r=>r.rule).length;
 $('#batchSum').innerHTML=`<div><span class="muted">${t('rows')}</span><strong>${rows.length}</strong></div><div><span class="muted">${t('skipped')}</span><strong>${skipped}</strong></div><div><span class="muted">${t('flagged')}</span><strong>${nPos}</strong></div><div><span class="muted">${t('ruleFlag')}</span><strong>${nRule}</strong></div>`;
 $('#batchTbl').innerHTML=`<tr><th>#</th><th class="num">${t('age')}</th><th>${t('sex')}</th><th class="num">Hb</th><th class="num">MCV</th><th class="num">RDW</th><th class="num">${t('prob')}</th><th>IronCBC</th><th>${t('ruleRow')}</th></tr>`+
  rows.slice(0,500).map(r=>`<tr><td>${r._i}</td><td class="num">${r.age}</td><td>${r.sex==='F'?t('female'):t('male')}</td><td class="num">${r.HGB}</td><td class="num">${r.MCV}</td><td class="num">${r.RDW_CV}</td><td class="num">${Math.round(r.prob*100)}%</td><td><span class="pill ${r.rec?'r':'g'}">${r.rec?t('pos'):t('neg')}</span>${r.thal?' <span class="pill n">β-thal?</span>':''}</td><td>${r.rule?t('ruleYes'):t('ruleNo')}</td></tr>`).join('');
 $('#dlBatch').classList.remove('hidden');
}
function dlBatch(){
 if(!BATCH) return;
 const out=BATCH.rows.map(r=>({...r._src, IronCBC_probability:+r.prob.toFixed(4), IronCBC_ferritin_recommended:r.rec?'yes':'no', clinical_rule_orders_ferritin:r.rule?'yes':'no', possible_thal_trait:r.thal?'yes':'no', calibration:BATCH.cal}));
 const ws=XLSX.utils.json_to_sheet(out); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'IronCBC'); XLSX.writeFile(wb,'IronCBC_results.xlsx');
}
function template(withFer){
 const h=['age','sex','WBC','RBC','HGB','HCT','MCV','MCH','MCHC','RDW','PLT'].concat(withFer?['Ferritin']:[]);
 const ex=[47,'F',7.4,4.72,8.0,30.1,63.8,16.9,26.5,18.9,306].concat(withFer?[6.33]:[]);
 const ws=XLSX.utils.aoa_to_sheet([h,ex]); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'data');
 XLSX.writeFile(wb, withFer?'IronCBC_calibration_template.xlsx':'IronCBC_batch_template.xlsx');
}

/* ---------------- calibration ---------------- */
function aucOf(y,s){ // Mann-Whitney with ties
 const idx=s.map((v,i)=>i).sort((a,b)=>s[a]-s[b]); const rank=new Array(s.length);
 for(let i=0;i<idx.length;){ let j=i; while(j+1<idx.length && s[idx[j+1]]===s[idx[i]]) j++; const r=(i+j)/2+1; for(let k=i;k<=j;k++) rank[idx[k]]=r; i=j+1; }
 let n1=0,sr=0; y.forEach((v,i)=>{ if(v){ n1++; sr+=rank[i]; } }); const n0=y.length-n1;
 return (sr-n1*(n1+1)/2)/(n1*n0);
}
function fitLogit1(x,y){ // Newton for y ~ a + b x
 let a=0,b=1;
 for(let it=0;it<50;it++){
  let g0=0,g1=0,h00=0,h01=0,h11=0;
  for(let i=0;i<x.length;i++){ const p=expit(a+b*x[i]); const w=p*(1-p)+1e-9; g0+=y[i]-p; g1+=(y[i]-p)*x[i]; h00+=w; h01+=w*x[i]; h11+=w*x[i]*x[i]; }
  const det=h00*h11-h01*h01; if(Math.abs(det)<1e-12) break;
  const da=( h11*g0-h01*g1)/det, db=(-h01*g0+h00*g1)/det; a+=da; b+=db; if(Math.abs(da)+Math.abs(db)<1e-8) break;
 }
 return {a,b};
}
let CALDATA=null, CANDIDATE=null;
async function runCal(){
 const f=$('#calFile').files[0]; if(!f) return; $('#calMsg').innerHTML=''; $('#calOut').classList.add('hidden');
 let raw; try{ raw=await readFile(f); }catch(e){ $('#calMsg').innerHTML=`<div class="note err">${t('readErr')}</div>`; return; }
 const {rows,missing}=cleanRows(raw,true);
 if(missing.length){ $('#calMsg').innerHTML=`<div class="note err">${missing.includes('ferritin')?t('needFer'):t('colsMissing')+': <span class="ltr">'+missing.join(', ')+'</span>'}</div>`; return; }
 const y=rows.map(r=>r.ferritin<=30?1:0); const ev=y.reduce((a,b)=>a+b,0);
 if(rows.length<100||ev<30||rows.length-ev<30){ $('#calMsg').innerHTML=`<div class="note err">${t('few')}</div>`; return; }
 const lp=rows.map(r=>logit(predictRaw(FEATS.map(k=>k==='female'?(r.sex==='F'?1:0):r[k]))));
 const {a,b}=fitLogit1(lp,y); const q=lp.map(v=>expit(a+b*v)); const rule=rows.map(clinicalRule);
 CALDATA={rows,y,q,lp,a,b,rule,auc:aucOf(y,lp)}; updateCal();
}
function updateCal(){
 const tg=+$('#target').value/100; $('#targetVal').textContent=Math.round(tg*100)+'%';
 if(!CALDATA) return; const {y,q,rule,a,b,auc,rows}=CALDATA;
 const pos=q.filter((v,i)=>y[i]).sort((u,v)=>v-u); const k=Math.max(0,Math.ceil(tg*pos.length)-1); const thr=pos[k];
 const stat=pred=>{ let tp=0,fn=0,tn=0,fp=0; pred.forEach((p,i)=>{ if(y[i]){ p?tp++:fn++; } else { p?fp++:tn++; } }); return {sens:tp/(tp+fn),spec:tn/(tn+fp),tests:100*(tp+fp)/y.length}; };
 const sm=stat(q.map(v=>v>=thr)), sr=stat(rule);
 const ev=y.reduce((s,v)=>s+v,0);
 $('#calKpi').innerHTML=`<div><span class="muted">${t('n')}</span><strong>${rows.length}</strong></div><div><span class="muted">${t('events')}</span><strong>${ev}</strong></div><div><span class="muted">${t('auc')}</span><strong class="ltr">${auc.toFixed(3)}</strong></div>`;
 $('#calTbl').innerHTML=`<tr><th>${t('method')}</th><th class="num">${t('sens')}</th><th class="num">${t('spec')}</th><th class="num">${t('tests')}</th></tr>
  <tr><td>${t('modelRow')}</td><td class="num">${(sm.sens*100).toFixed(1)}%</td><td class="num">${(sm.spec*100).toFixed(1)}%</td><td class="num">${sm.tests.toFixed(1)}</td></tr>
  <tr><td>${t('ruleRow')}</td><td class="num">${(sr.sens*100).toFixed(1)}%</td><td class="num">${(sr.spec*100).toFixed(1)}%</td><td class="num">${sr.tests.toFixed(1)}</td></tr>`;
 CANDIDATE={intercept:+a.toFixed(4),slope:+b.toFixed(4),threshold:+thr.toFixed(4),target_sensitivity:tg,n:rows.length,events:ev,auc:+auc.toFixed(3),created:new Date().toISOString().slice(0,10),model_version:MODEL.version};
 $('#calOut').classList.remove('hidden');
}
function saveCal(){ if(!CANDIDATE) return; setUserCal(CANDIDATE); fillCalSelects(); $('#calSelect').value='user'; $('#calSelect2').value='user'; $('#calMsg').innerHTML=`<div class="note info">${t('saved')}</div>`; }
function dlCal(){ if(!CANDIDATE) return; const b=new Blob([JSON.stringify(CANDIDATE,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='IronCBC_my_lab_calibration.json'; a.click(); }
function loadCal(e){ const f=e.target.files[0]; if(!f) return; const fr=new FileReader(); fr.onload=()=>{ try{ const c=JSON.parse(fr.result); if(typeof c.intercept!=='number'||typeof c.slope!=='number'||typeof c.threshold!=='number') throw 0; setUserCal(c); fillCalSelects(); $('#calSelect').value='user'; $('#calSelect2').value='user'; $('#calMsg').innerHTML=`<div class="note info">${t('saved')}</div>`; }catch(err){ $('#calMsg').innerHTML=`<div class="note err">${t('readErr')}</div>`; } }; fr.readAsText(f); }

/* ---------------- about ---------------- */
function about(){
 const c=MODEL.calibrations.najaf_outpatient_lab, mc=MODEL.calibrations.mimic_hospital;
 if(LANG==='ar') return `<h2>حول الأداة</h2>
 <h3>النموذج</h3><p>غابة عشوائية (100 شجرة) مُدرَّبة على ${MODEL.trained_on.replace(/.*n=/,'')} مشاركاً من مسح NHANES (دورات 2015–2016 و2017–2020 و2021–2023، عمر 12 سنة فأكثر، غير الحوامل). المدخلات: العمر والجنس وWBC وRBC وHb وHCT وMCV وMCH وMCHC وRDW-CV وPLT. الهدف: فيريتين 30 نانوغرام/مل أو أقل.</p>
 <h3>المعايرة</h3><p>يميّز النموذج المرضى جيداً بين البلدان، لكن احتمالاته وحدّ القرار لا ينتقلان كما هما. تتوفر معايرتان جاهزتان: مختبر خارجي من ${c.n} مريضاً في النجف (${c.events} بنقص حديد)، ومستشفى من ${mc.n.toLocaleString('en')} مريضاً في MIMIC-IV (${mc.events.toLocaleString('en')} بنقص حديد). في كلتيهما ضُبط الحد ليكشف نفس نسبة الحالات التي تكشفها القاعدة السريرية البسيطة. للاستخدام في مختبر آخر يُنصح بالمعايرة من تبويب «معايرة لمختبرك».</p>
 <h3>حدود الاستخدام</h3><ul><li>أداة بحثية، وليست جهازاً تشخيصياً.</li><li>لا تُفرّق بشكل موثوق بين نقص الحديد وحامل الثلاسيميا.</li><li>الالتهاب يرفع الفيريتين وقد يُخفي نقص الحديد.</li><li>غير مُختبرة على الحوامل والأطفال دون 12 سنة.</li></ul>
 <h3>الخصوصية</h3><p>تجري كل الحسابات داخل متصفحك، ولا تُرفع أي ملفات إلى أي خادم.</p><h3>الشيفرة المصدرية</h3><p><a href="https://github.com/hussein-alnaffakh1984/IronCBC" target="_blank" rel="noopener" class="ltr">https://github.com/hussein-alnaffakh1984/IronCBC</a></p>`;
 return `<h2>About</h2>
 <h3>Model</h3><p>Random forest (100 trees) trained on ${MODEL.trained_on.replace(/.*n=/,'')} NHANES participants (cycles 2015–2016, 2017–March 2020, 2021–2023; age ≥12; non-pregnant). Inputs: age, sex, WBC, RBC, Hb, HCT, MCV, MCH, MCHC, RDW-CV, PLT. Outcome: ferritin ≤30 ng/mL.</p>
 <h3>Calibration</h3><p>The model ranks patients well across countries, but its probabilities and decision threshold do not transfer as they are. Two ready calibrations are provided: an outpatient laboratory in Najaf, Iraq (${c.n} patients, ${c.events} iron deficient) and hospital patients from MIMIC-IV (${mc.n.toLocaleString('en')} patients, ${mc.events.toLocaleString('en')} iron deficient). In both, the threshold detects the same share of cases as the simple clinical rule. For another laboratory, calibrate locally in the “Calibrate to your lab” tab.</p>
 <h3>Limitations</h3><ul><li>Research tool, not a diagnostic device.</li><li>Does not reliably separate iron deficiency from thalassaemia trait.</li><li>Inflammation raises ferritin and can mask iron deficiency.</li><li>Not evaluated in pregnancy or in children under 12.</li></ul>
 <h3>Privacy</h3><p>All computation runs in your browser; no file is uploaded to any server.</p><h3>Source code</h3><p><a href="https://github.com/hussein-alnaffakh1984/IronCBC" target="_blank" rel="noopener">https://github.com/hussein-alnaffakh1984/IronCBC</a></p>`;
}

}

$('#clear').onclick=()=>{ $('#exNote').textContent=''; document.querySelectorAll('#inputs input').forEach(e=>e.value=''); $('#resBox').className='result none'; $('#resBox').innerHTML=`<div class="muted">${t('noRes')}</div>`; $('#idxCard').classList.add('hidden'); $('#checks').innerHTML=''; };
$('#calSelect').onchange=()=>{ if(!$('#resBox').classList.contains('none')) runOne(); };
$('#batchFile').onchange=runBatch; $('#calSelect2').onchange=()=>{ if(BATCH) runBatch(); };
$('#dlBatch').onclick=dlBatch; $('#tplBatch').onclick=()=>template(false); $('#tplCal').onclick=()=>template(true);
$('#calFile').onchange=runCal; $('#target').value=80; $('#target').oninput=updateCal; $('#saveCal').onclick=saveCal; $('#dlCal').onclick=dlCal; $('#loadCal').onchange=loadCal;
applyLang(); updateCal();
